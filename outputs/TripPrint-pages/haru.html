<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TripPrint · 전체 페이지 미리보기</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff9f3;
        color: #203247;
        font-family: 'Malgun Gothic', sans-serif;
      }
      main {
        max-width: 1400px;
        margin: auto;
        padding: 48px 36px;
      }
      .brand {
        font-weight: 900;
        font-size: 30px;
        letter-spacing: -1px;
      }
      .brand span {
        color: #ff6b57;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
        margin-top: 32px;
        color: #c84432;
        font-weight: 700;
      }
      h1 {
        font-size: 34px;
        margin: 12px 0 16px;
        letter-spacing: -1.5px;
      }
      .lead {
        font-size: 15px;
        line-height: 1.8;
        color: #677584;
        max-width: 850px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 24px 0 34px;
      }
      .chips span {
        border: 1px solid #e8ddd3;
        border-radius: 30px;
        padding: 8px 14px;
        font-size: 12px;
        background: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }
      article {
        background: #fff;
        border: 1px solid #e8ddd3;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 5px 16px #20324706;
      }
      .card-head {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 18px 14px;
        border-bottom: 1px solid #f0e8e0;
      }
      h2 {
        font-size: 14px;
        margin: 0;
      }
      .number {
        font-size: 12px;
        color: #c84432;
        font-weight: 700;
      }
      article img {
        width: 100%;
        height: auto;
        display: block;
      }
      article > a {
        display: block;
        padding: 12px;
        background: #f7f0e9;
      }
      .card-foot {
        padding: 14px;
        min-height: 85px;
      }
      code {
        font-size: 10px;
        word-break: break-all;
        color: #9b604f;
      }
      .card-foot p {
        font-size: 11px;
        line-height: 1.6;
        color: #768390;
        margin: 8px 0 0;
      }
      .footer {
        font-size: 12px;
        line-height: 1.9;
        color: #768390;
        margin-top: 36px;
      }
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
      }
      .lightbox:target {
        display: flex;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background: #142232dd;
      }
      .expanded {
        position: relative;
        background: white;
        border-radius: 16px;
        padding: 14px;
        max-height: 95vh;
        overflow: auto;
      }
      .expanded header {
        display: flex;
        gap: 24px;
        justify-content: space-between;
        font-size: 13px;
        margin: 4px 0 14px;
      }
      .expanded header a {
        color: #c84432;
      }
      .expanded img {
        width: min(390px, 80vw);
        display: block;
      }
      a {
        color: inherit;
      }
      .overview main {
        padding: 36px;
      }
      .overview .grid {
        gap: 18px;
      }
      .overview .card-foot {
        min-height: 63px;
      }
      .overview article > a {
        padding: 8px;
      }
      .overview h1 {
        font-size: 30px;
      }
      .overview .chips {
        margin-bottom: 28px;
      }
      @media (max-width: 950px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        main {
          padding: 28px 18px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }
        h1 {
          font-size: 27px;
        }
        .card-head {
          padding: 12px 10px;
        }
        h2 {
          font-size: 12px;
        }
      }
      @media (max-width: 420px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="">
    <main>
      <div class="brand">Trip<span>Print</span></div>
      <div class="eyebrow">HARU · YOUR TRAVEL COMPANION</div>
      <h1>하루와 함께하는 TripPrint</h1>
      <p class="lead">
        여행 계획부터 사진과 비용 기록, 발자국 공유까지. 화면을 눌러 자세히
        살펴보세요.
      </p>
      <div class="chips">
        <span>여행 계획</span><span>친구와 함께</span><span>사진·영수증</span
        ><span>발자국 공유</span>
      </div>
      <div class="grid" id="screens">
        <article>
          <div class="card-head">
            <span class="number">01</span>
            <h2>하루와 다시 찾아보기</h2>
          </div>
          <a href="#haru-error" aria-label="하루와 다시 찾아보기 확대"
            ><img
              src="TripPrint_live-haru-error_390x844.png"
              alt="하루와 다시 찾아보기 실제 화면"
              loading="lazy"
          /></a>
          <div class="card-foot">
            <p>불러오지 못한 여행을 다시 확인해 보세요.</p>
          </div>
        </article>
      </div>
      <p class="footer">
        가고 싶은 곳을 계획하고, 다녀온 순간을 기록하세요. 나만의 발자국이 다음
        여행의 길잡이가 됩니다.
      </p>
    </main>
    <div class="lightbox" id="haru-error">
      <a class="backdrop" href="#screens" aria-label="확대 닫기"></a>
      <div class="expanded">
        <header>
          <b>하루와 다시 찾아보기</b><a href="#screens">닫기 ✕</a>
        </header>
        <img
          src="TripPrint_live-haru-error_390x844.png"
          alt="하루와 다시 찾아보기 확대 화면"
        />
      </div>
    </div>
  </body>
</html>
