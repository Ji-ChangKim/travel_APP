name: Android Play Internal

# GitHub 실행 환경에서 Gradle로 앱을 빌드하고 선택한 경우에만 Play에 제출한다.
on:
  workflow_dispatch:
    inputs:
      artifact_type:
        description: 'apk: 휴대폰 직접 설치 / aab: Play 등록용'
        required: true
        type: choice
        default: apk
        options: [apk, aab]
      submit_play:
        description: '빌드한 AAB를 Google Play 내부 테스트에 제출'
        type: boolean
        default: false
      release_status:
        description: 'draft: 초안 등록 / completed: 내부 테스터에게 출시'
        required: true
        type: choice
        default: draft
        options: [draft, completed]
      version_code:
        description: '선택: Play의 기존 버전 코드보다 큰 정수 (빈 값은 실행 번호로 증가)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tripprint-play-internal
  cancel-in-progress: false

jobs:
  build-and-submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 코드 품질 및 릴리스 검사
        run: npm run check && npm run test:auth && npm run test:release

      - name: JDK 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 설정
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: 공개 서버 주소와 버전 코드 준비
        id: config
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_CODE_BASE: ${{ vars.ANDROID_VERSION_CODE_BASE || '1000' }}
        run: node scripts/prepare-android-ci.mjs

      - name: 선택한 산출물의 서명 및 제출 자격 확인
        id: signing
        env:
          ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          SUBMIT_PLAY: ${{ inputs.submit_play }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # 직접 설치용 APK는 기본 테스트 서명을 사용하고 Play AAB에는 업로드 키를 요구한다.
          if [ "$SUBMIT_PLAY" = 'true' ] && [ "$ARTIFACT_TYPE" != 'aab' ]; then
            echo '::error::Play 제출은 artifact_type=aab로 실행하세요.'
            exit 1
          fi
          if [ "$ARTIFACT_TYPE" = 'aab' ] || [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Actions Secrets에 $name 등록이 필요합니다."
                exit 1
              fi
            done
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tripprint-upload.jks"
            chmod 600 "$RUNNER_TEMP/tripprint-upload.jks"
            echo 'mode=upload' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=test' >> "$GITHUB_OUTPUT"
          fi
          if [ "$SUBMIT_PLAY" = 'true' ] && [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::Play 제출용 GOOGLE_PLAY_SERVICE_ACCOUNT_JSON을 등록하세요.'
            exit 1
          fi

      - name: 앱 설정으로 Android 네이티브 프로젝트 생성
        working-directory: apps/mobile
        run: npx --no-install expo prebuild --platform android --no-install

      - name: GitHub에서 Gradle APK 또는 AAB 빌드
        working-directory: apps/mobile/android
        env:
          ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          TRIPPRINT_ANDROID_SIGNING: ${{ steps.signing.outputs.mode }}
          TRIPPRINT_KEYSTORE_FILE: ${{ runner.temp }}/tripprint-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # EAS를 호출하지 않고 생성된 네이티브 프로젝트를 직접 컴파일한다.
          chmod +x gradlew
          case "$ARTIFACT_TYPE" in
            apk) task=:app:assembleRelease ;;
            aab) task=:app:bundleRelease ;;
            *) echo '::error::지원하지 않는 산출물입니다.'; exit 1 ;;
          esac
          ./gradlew "$task" --init-script "$GITHUB_WORKSPACE/scripts/android-ci.gradle" --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'

      - name: 설치 파일 또는 Play 업로드 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: tripprint-${{ inputs.artifact_type }}-${{ steps.config.outputs.version_code }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: 빌드 결과 안내
        env:
          ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          VERSION_CODE: ${{ steps.config.outputs.version_code }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          # 실행 화면의 Artifacts에서 앱을 내려받을 수 있도록 결과를 요약한다.
          echo "TripPrint $ARTIFACT_TYPE 빌드 완료 / versionCode=$VERSION_CODE / 서명=$SIGNING_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo '이 실행 화면의 Artifacts에서 파일을 다운로드하세요.' >> "$GITHUB_STEP_SUMMARY"

      - name: AAB를 Google Play 내부 테스트에 직접 제출
        if: inputs.submit_play
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tripprint.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: ${{ inputs.release_status }}

      - name: Play 제출 결과 안내
        if: inputs.submit_play
        env:
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: echo "Play 내부 테스트 제출 완료 ($RELEASE_STATUS). 실제 배포·심사 상태는 Play Console에서 확인하세요." >> "$GITHUB_STEP_SUMMARY"

      - name: 임시 업로드 서명 키 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/tripprint-upload.jks"
