name: Android Play Internal

# 사용자가 선택한 main 버전을 AAB로 빌드하고 내부 테스트 트랙에 제출한다.
on:
  workflow_dispatch:
    inputs:
      release_status:
        description: 'draft: 초안 등록 / completed: 내부 테스터에게 출시'
        required: true
        type: choice
        default: draft
        options: [draft, completed]

permissions:
  contents: read

# 같은 패키지의 버전 증가와 제출 순서가 겹치지 않도록 직렬로 실행한다.
concurrency:
  group: tripprint-play-internal
  cancel-in-progress: false

jobs:
  build-and-submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Expo 접근 토큰 확인
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # 토큰 원문을 출력하지 않고 등록 여부만 확인한다.
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::GitHub Actions Secrets에 EXPO_TOKEN을 등록하세요.'
            exit 1
          fi

      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 코드 품질 검사
        run: npm run check

      - name: 인증 및 릴리스 검사
        run: npm run test:auth && npm run test:release

      - name: Expo와 EAS 인증 설정
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Android AAB 빌드 완료 대기
        working-directory: apps/mobile
        run: |
          # 이번 실행의 결과만 다음 제출 단계에 전달한다.
          eas build --platform android --profile play-internal --non-interactive --wait --json > "$RUNNER_TEMP/tripprint-build.json"

      - name: 완료된 Android 빌드 식별자 확인
        id: build
        env:
          BUILD_RESULT_PATH: ${{ runner.temp }}/tripprint-build.json
        run: |
          # 실패·대기·다른 플랫폼 결과를 Play 제출 대상으로 사용하지 않는다.
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const builds = JSON.parse(readFileSync(process.env.BUILD_RESULT_PATH, 'utf8'));
          const build = builds[0];
          if (!Array.isArray(builds) || builds.length !== 1 || build?.status !== 'FINISHED' || build.platform !== 'ANDROID' || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(build.id)) {
            throw new Error('완료된 Android 빌드 하나의 ID가 필요합니다. EAS 빌드 로그를 확인하세요.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${build.id}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Android AAB 빌드 완료: ${build.id}\n`);
          NODE

      - name: 이번 AAB의 Play 내부 테스트 제출 완료 대기
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: |
          # 공개 운영 트랙이 아닌 내부 테스트의 초안 또는 출시 프로필만 선택한다.
          case "$RELEASE_STATUS" in
            draft) submit_profile=play-internal-draft ;;
            completed) submit_profile=play-internal ;;
            *) echo '::error::지원하지 않는 출시 상태입니다.'; exit 1 ;;
          esac
          eas submit --platform android --profile "$submit_profile" --id "$BUILD_ID" --non-interactive --wait
          echo "Play 내부 테스트 제출 완료: $RELEASE_STATUS / $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
