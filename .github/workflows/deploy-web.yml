name: Deploy Staging or Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 대상
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RELEASE_ENV: ${{ inputs.environment }}
      RELEASE_WEB_ORIGIN: ${{ vars.RELEASE_WEB_ORIGIN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      EXPO_PUBLIC_BACKEND: cloudflare
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_AUTH_WEB_REDIRECT_URL: ${{ vars.EXPO_PUBLIC_AUTH_WEB_REDIRECT_URL }}
      EXPO_NO_DOTENV: '1'
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 공개 설정 검사 및 Worker 설정 생성
        run: npm run release:config
      - name: Cloudflare 배포 자격 설정 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm run check
      - run: npm run test:auth
      - run: npm run test:release
      - run: npm run test:foundation
      - run: npm run test:cloud
      - name: Chrome 설치
        run: npx playwright install --with-deps chrome
      - name: 앱 핵심 흐름 검사 및 실제 설정 번들 복원
        run: npm run test:workspace:web
      - name: 캐시를 초기화하여 릴리스 웹 빌드
        run: npm --workspace=@wherego/mobile run build:web -- --clear
      - name: 내보내기 경로 검사
        run: npm run release:artifacts
      - name: Worker 배포 사전 빌드
        working-directory: apps/api
        run: npx --no-install wrangler deploy --config .release/wrangler.json --dry-run
      - name: 선택 환경의 D1 마이그레이션 적용
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply DB --remote --config .release/wrangler.json
      - name: API 배포
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config .release/wrangler.json
      - name: 웹 배포 (별도 Pages 프로젝트의 기본 브랜치)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy ../mobile/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ inputs.environment }}-${{ github.sha }}
          path: apps/mobile/dist
          retention-days: 7
