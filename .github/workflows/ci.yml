name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 코드 품질 및 타입 검사
        run: npm run check

      - name: DB·API 기반 검증
        run: npm run test:foundation
      - name: 실제 Workers D1·R2·인증 통합 검증
        run: npm run test:cloud

      - name: 인증 및 배포 설정 검증
        run: npm run test:auth && npm run test:release

      - name: Chrome 설치
        run: npx playwright install --with-deps chrome

      - name: 앱 핵심 화면 흐름 검증
        run: npm run test:workspace:web

      - name: Worker 배포 번들 검증
        run: npm run api:build

      - name: 웹 정적 빌드 테스트
        run: npm run build:web
