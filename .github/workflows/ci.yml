name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 코드 품질 및 타입 검사
        run: npm run check

      - name: 웹 정적 빌드 테스트
        run: npm run build:web
