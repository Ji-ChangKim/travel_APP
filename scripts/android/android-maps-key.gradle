// 지도 SDK 키만 로컬 릴리스 설정에서 읽고 빌드 로그에는 출력하지 않는다.
def tripprintMapsEnv = new File(rootProject.ext.tripprintRepositoryRoot, '.env.release')
def tripprintMapsEntry = tripprintMapsEnv.exists() ? tripprintMapsEnv.readLines('UTF-8').find { line ->
    // 다른 서버 비밀과 OAuth 값은 읽어 전달하지 않는다.
    line ==~ /\s*GOOGLE_MAPS_ANDROID_API_KEY\s*=.*/
} : null
def tripprintMapsRaw = System.getenv('GOOGLE_MAPS_ANDROID_API_KEY') ?: (tripprintMapsEntry ? tripprintMapsEntry.substring(tripprintMapsEntry.indexOf('=') + 1).trim() : '')
def tripprintMapsKey = tripprintMapsRaw.trim().replaceAll(/^(['"])(.*)\1$/, '$2')
// 잘못된 값은 지도 초기화에 사용하지 않으며 앱의 다른 기능은 유지한다.
android.defaultConfig.manifestPlaceholders['tripprintMapsApiKey'] = tripprintMapsKey ==~ /AIza[A-Za-z0-9_-]{35}/ ? tripprintMapsKey : ''

// 키를 나중에 추가한 빌드에서도 지도 표시 가능 여부를 다시 생성한다.
gradle.projectsEvaluated {
    // JavaScript에는 키 원문 대신 설정 여부만 전달한다.
    def tripprintMapsEnabled = tripprintMapsKey ==~ /AIza[A-Za-z0-9_-]{35}/
    rootProject.findProject(':expo-constants')?.tasks?.matching { task ->
        // Expo 공개 설정 생성 작업만 새 키 설정 여부에 반응한다.
        task.name == 'createExpoConfig'
    }?.configureEach { task ->
        // 키 입력 전의 false 캐시가 새 빌드에 남지 않게 한다.
        task.inputs.property('tripprintMapsEnabled', tripprintMapsEnabled)
    }
    tasks.matching { task ->
        // 지도 표시 여부가 바뀐 경우에만 앱 번들을 다시 만든다.
        task.name.startsWith('createBundle') && task.name.endsWith('JsAndAssets')
    }.configureEach { task ->
        // 키 원문은 Gradle 입력 속성에도 기록하지 않는다.
        task.inputs.property('tripprintMapsEnabled', tripprintMapsEnabled)
    }
}
