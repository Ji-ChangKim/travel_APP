<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>영수증 모바일 스케치 · 검토안</title>
    <style>
      @font-face {
        font-family: Pretendard;
        src: url('../../../apps/mobile/assets/brand/tripprint-v1/fonts/PretendardVariable.woff2')
          format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9edf4;
        color: #0b1c30;
        font-family: Pretendard, system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.625;
      }
      .tools {
        padding: 24px;
        background: #fff;
        border-bottom: 1px solid #76777d;
      }
      .tools h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      .tools p {
        margin: 0 0 12px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .controls label {
        display: grid;
        gap: 4px;
      }
      .controls select {
        font: inherit;
        min-height: 48px;
        border: 1px solid #76777d;
        border-radius: 12px;
        padding: 8px;
        max-width: 100%;
      }
      .controls a {
        color: #ae3115;
      }
      .board {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        padding: 24px;
        overflow-x: auto;
      }
      .panel {
        width: var(--width, 390px);
        flex: none;
      }
      .caption {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      .phone {
        background: #f8f9ff;
        border: 1px solid #76777d;
        --z: 1;
        font-size: calc(16px * var(--z));
        line-height: calc(26px * var(--z));
        overflow-wrap: anywhere;
      }
      .header {
        padding: 6px 20px;
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 60px;
        color: #203247;
      }
      .back {
        flex: none;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
      }
      .back svg {
        width: 24px;
        height: 24px;
      }
      .header h1 {
        font-size: calc(26px * var(--z));
        line-height: calc(36px * var(--z));
        font-weight: 700;
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 2px 0;
      }
      .content {
        padding: 20px;
        display: grid;
        gap: 24px;
      }
      .content p {
        margin: 0;
      }
      .content h2 {
        font-size: calc(20px * var(--z));
        line-height: calc(28px * var(--z));
        font-weight: 700;
        margin: 0;
      }
      .card,
      .note {
        display: grid;
        gap: 12px;
        padding: 16px;
        background: #fff;
        border: 1px solid #76777d;
        border-radius: 16px;
        min-width: 0;
      }
      .note {
        background: #eff4ff;
      }
      .field {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      .label,
      .meta {
        font-size: calc(14px * var(--z));
        line-height: calc(22px * var(--z));
        color: #45464d;
      }
      .input {
        min-height: 48px;
        padding: 12px;
        background: #fff;
        border: 1px solid #76777d;
        border-radius: 12px;
        min-width: 0;
      }
      .muted {
        color: #45464d;
      }
      .invalid {
        border: 2px solid #9e3438;
      }
      .error {
        font-size: calc(14px * var(--z));
        line-height: calc(22px * var(--z));
        color: #9e3438;
      }
      .button,
      .choice {
        min-height: 48px;
        min-width: 48px;
        padding: 12px 16px;
        border: 1px solid #76777d;
        border-radius: 12px;
        background: #fff;
        font-size: calc(16px * var(--z));
        line-height: calc(24px * var(--z));
        font-weight: 600;
        text-align: center;
      }
      .primary {
        min-height: 52px;
        background: #ae3115;
        color: #fff;
        border-color: #ae3115;
      }
      .locked {
        background: #eee8e2;
        color: #596574;
        border-color: #76777d;
      }
      .choice {
        text-align: left;
        font-weight: 400;
      }
      .selected {
        background: #131b2e;
        color: #fff;
      }
      .photo {
        padding: 24px;
        min-height: 240px;
        display: grid;
        place-items: center;
        background: #eff4ff;
        border: 1px solid #76777d;
        border-radius: 16px;
      }
      .paper {
        width: 100%;
        max-width: 220px;
        min-height: 240px;
        padding: 16px;
        background: white;
        border: 1px solid #76777d;
        display: grid;
        gap: 24px;
        text-align: center;
      }
      .receipt-lines {
        height: 48px;
        background: repeating-linear-gradient(
          to bottom,
          #76777d 0,
          #76777d 1px,
          transparent 1px,
          transparent 12px
        );
      }
      .memo {
        padding: 16px 24px;
        background: #fff;
        margin: 0;
      }
      .phone.saving .input,
      .phone.saving .choice {
        background: #eee8e2;
        color: #596574;
      }
      .phone.saving .selected {
        background: #131b2e;
        color: #fff;
      }
      @media (max-width: 600px) {
        .tools {
          padding: 16px;
        }
        .board {
          padding: 16px;
        }
        .controls {
          display: grid;
        }
        .controls select {
          width: 100%;
        }
      }

      /* 기존 Ledger 시안의 면과 정보 위계를 적용한다. 공통 헤더 수치는 유지한다. */
      .phone {
        border-color: #d3e4fe;
        border-radius: 16px;
        min-height: 780px;
      }
      .card {
        border: 0;
      }
      .note {
        border: 0;
      }
      .input {
        background: #eff4ff;
      }
      .input.invalid {
        background: #fceeef;
      }
      .photo {
        border-color: #d3e4fe;
      }
      .content > .meta:first-child {
        padding: 12px 16px;
        border-radius: 12px;
        background: #eff4ff;
      }
      .card h2 {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-icon {
        width: 24px;
        height: 24px;
        flex: none;
        color: #ae3115;
      }
      .haru {
        width: 190px;
        height: 210px;
        max-width: 100%;
        object-fit: contain;
        justify-self: center;
      }
      .state-note {
        background: #fff;
        text-align: center;
      }
      .state-note p {
        color: #45464d;
        font-size: calc(14px * var(--z));
        line-height: calc(22px * var(--z));
      }
      .state-note:has(.haru) {
        padding: 24px;
      }
      .receipt-preview {
        display: grid;
        gap: 12px;
      }
      .receipt-preview .photo {
        min-height: 180px;
        padding: 16px;
      }
      .receipt-preview .paper {
        min-height: 140px;
        gap: 12px;
      }
      .receipt-preview .receipt-lines {
        height: 24px;
      }
      .privacy-copy {
        background: #fffdf5;
        color: #78350f;
        padding: 16px;
        border-radius: 12px;
      }
      .tools {
        border-bottom-color: #d3e4fe;
      }
      .tools-brand {
        width: 154px;
        height: 48px;
        object-fit: contain;
        object-position: left;
        margin-bottom: 12px;
      }
      .caption {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .caption::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #ae3115;
        border-radius: 50%;
        flex: none;
      }
    </style>
  </head>
  <body>
    <header class="tools">
      <img
        class="tools-brand"
        src="../../../apps/mobile/assets/brand/tripprint-v1/TripPrint_logo-horizontal-navy_1024x320.png"
        alt="TripPrint"
      />
      <h1>영수증 모바일 디자인 검토안</h1>
      <p>
        기존 Ledger 시안 적용 · 정책 승인 / 화면 검토 중 · 가상 여행·금액 예시 ·
        실제 촬영·인식·저장 기능 없음
      </p>
      <div class="controls">
        <label>화면<select id="screen"></select></label
        ><label
          >상태<select id="state">
            <option value="all">네 상태 나란히</option>
            <option value="normal">정상</option>
            <option value="empty">빈 상태</option>
            <option value="error">오류·복구</option>
            <option value="busy">저장·처리 중</option>
          </select></label
        ><label
          >논리 폭<select id="width">
            <option>320</option>
            <option>360</option>
            <option selected>390</option>
            <option>430</option>
          </select></label
        ><label
          >글자 배율<select id="scale">
            <option value="1">100%</option>
            <option value="2">200%</option>
          </select></label
        >
      </div>
    </header>
    <p class="memo" id="memo"></p>
    <main class="board" id="board"></main>

              '<div class="note"><h2>삭제하지 못했어요</h2><p>기존 기록은 그대로 있어요. 다시 시도해 주세요.</p></div><div class="button primary ">다시 시도</div><div class="button  ">취소</div>',

      const picker = document.querySelector('#screen');
      // 검토 도구만 동작하며 화면 내부 행동은 실제 서비스를 실행하지 않는다.
      for (const s of screens) {
        const o = document.createElement('option');
        o.value = s.key;
        o.textContent = s.ref + ' · ' + s.title;
        picker.append(o);
      }
      picker.value = 'confirm';
      // 원본 시안의 정보 카드와 브랜드 자산만 적용하고 상태별 문구·정책은 보존한다.
      function applyDesign(screen, state) {
        const body = document.createElement('div');
        body.innerHTML = screen.states[state];
        const poses = {
          empty: 'TripPrint_Haru_empty_1024x1536.png',
          error: 'TripPrint_Haru_error_1024x1536.png',
          busy: 'TripPrint_Haru_loading_1233x1275.png',
        };
        const note = body.querySelector('.note');
        if (note && poses[state]) {
          note.classList.add('state-note');
          const portrait = document.createElement('img');
          portrait.className = 'haru';
          portrait.alt = '';
          portrait.src =
            '../../../apps/mobile/assets/brand/haru-v1/' + poses[state];
          note.prepend(portrait);
        }
        const icon =
          '<svg class="section-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 4h6M9 11h6M9 15h4"/></svg>';
        for (const heading of body.querySelectorAll('.card h2'))
          heading.insertAdjacentHTML('afterbegin', icon);
        for (const p of body.querySelectorAll('.meta')) {
          if (p.textContent.startsWith('원본과 메뉴는'))
            p.classList.add('privacy-copy');
        }
        if (screen.key === 'confirm') {
          const original = [...body.querySelectorAll('.button')].find(
            (e) => e.textContent === '원본 보기',
          );
          if (original) {
            const preview = document.createElement('section');
            preview.className = 'card receipt-preview';
            preview.innerHTML =
              '<h2>' +
              icon +
              '영수증 원본</h2><div class="photo"><div class="paper"><span class="receipt-lines"></span><p class="meta">원본 이미지 자리<br>검토용 도형</p><span class="receipt-lines"></span></div></div>';
            original.before(preview);
            preview.append(original);
          }
        }
        return body.innerHTML;
      }
      function render() {
        const s = screens.find((x) => x.key === picker.value);
        const state = document.querySelector('#state').value;
        const keys =
          state === 'all' ? ['normal', 'empty', 'error', 'busy'] : [state];
        const names = {
          normal: '정상',
          empty: '빈 상태',
          error: '오류·복구',
          busy: s.busyLabel,
        };
        document.querySelector('#memo').textContent = s.memo;
        document.querySelector('#board').innerHTML = keys
          .map(
            (k) =>
              `<section class="panel" style="--width:${document.querySelector('#width').value}px"><p class="caption">${s.ref} · ${names[k]}</p><div class="phone ${k === 'busy' && s.busyLabel === '저장 중' ? 'saving' : ''}" inert style="--z:${document.querySelector('#scale').value}"><header class="header"><span class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></span><h1>${s.title}</h1></header><div class="content">${applyDesign(s, k)}</div></div></section>`,
          )
          .join('');
      }
      for (const el of document.querySelectorAll('select'))
        el.addEventListener('change', render);
      render();
    </script>
